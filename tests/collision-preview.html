<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충돌 동작 검증 · 사서를 잡아라!</title><link rel="stylesheet" href="../styles.css?v=20261023-chase3"><style>main{width:min(1060px,calc(100% - 24px));padding:10px 0}h1{font-size:24px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button,select{min-height:44px;padding:8px 12px}canvas{border:4px solid #61442f;border-radius:8px}output{display:block;margin:15px 0;padding:12px;background:#fff9ec;font-family:monospace;white-space:pre-wrap;font-size:14px}p{font-size:13px}</style></head><body><main><h1>충돌 동작 검증</h1><p>실제 게임의 물리·렌더러를 사용하는 개발 확인 화면입니다. 충돌 상자는 이 화면에서만 표시합니다.</p><div class="tools"><label for="scenario">상황</label><select id="scenario"><option value="stack">바닥 책 더미</option><option value="box">상자</option><option value="basket">바구니</option><option value="low">낮은 책</option><option value="high">높은 책 · 공중</option><option value="top">위에서 착지</option><option value="under">아래쪽 접촉</option><option value="fatal">마지막 체력</option></select><label for="bookform">책 모양</label><select id="bookform"><option value="book-red">닫힌 책</option><option value="book-green">펼쳐진 책</option><option value="book-blue">팔락이는 책</option></select><label for="speed">속도</label><select id="speed"><option value="normal">기본</option><option value="fast">5000px/s</option></select><button id="throw">책 던지기</button><button id="finish">30초 종료 연출</button><button id="gallery">소품 6종 보기</button><button id="debug">충돌 표시 전환</button><button id="scroll">배경 1000px 이동</button><button id="reset">다시 준비</button><button id="impact">충돌 순간</button><button id="step">0.1초 진행</button><button id="auto">자동 재생</button><button id="jump">점프</button></div><canvas id="preview" width="960" height="500" aria-label="실제 러너 충돌 동작"></canvas><output id="status">그림을 준비하고 있습니다.</output></main><script type="module">
import {SPRITE_LAYOUT,PROPS_LAYOUT,BACKGROUND_LAYOUT} from '../scene-data.js?v=20261023-chase3';import {createProp} from '../props.js?v=20261023-chase3';import {Chase} from '../engine.js?v=20261023-chase3';import {Renderer,obstacleOpacity} from '../renderer.js?v=20261023-chase3';import {CONFIG} from '../config.js?v=20261023-chase3';
const $=id=>document.getElementById(id),game=new Chase();let automatic=false,last=null;
const layout=SPRITE_LAYOUT;
const images=await Promise.all([...layout.sheets.map(s=>s.image),PROPS_LAYOUT.image,BACKGROUND_LAYOUT.image].map(src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src='../'+src})));
const renderer=new Renderer($('preview'),images,layout);renderer.debug=true;
function paint(){renderer.draw(game,game.elapsed);$('status').textContent=JSON.stringify({health:game.health,state:game.state,time:+game.elapsed.toFixed(3),distance:+game.distance.toFixed(3),discoveryAge:+game.discoveryAge.toFixed(2),hitFrame:game.hitFrame,x:+game.x.toFixed(3),y:+game.y.toFixed(3),vx:+game.vx.toFixed(2),propVx:+(game.obstacles[0]?.vx||0).toFixed(2),hitStop:+game.hitStop.toFixed(3),penetration:+game.maxPenetration.toFixed(6),props:game.obstacles.map(o=>({id:o.spriteId,width:+o.w.toFixed(2),height:+o.h.toFixed(2),x:+o.x.toFixed(2),lift:+o.lift.toFixed(2),vy:+(o.vy||0).toFixed(2),bounces:o.bounces,opacity:+obstacleOpacity(o).toFixed(3)}))},null,2)}
function reset(){automatic=false;last=null;$('auto').textContent='자동 재생';game.start();game.spawnAt=1000;const scenario=$('scenario').value,kind=scenario==='fatal'||scenario==='top'?'stack':scenario==='under'?'high':scenario;const airborne=['high','low'].includes(kind);game.obstacles=[createProp(airborne?$('bookform').value:kind==='stack'?'book-stack':kind,{id:1,kind,x:270,lift:kind==='high'?128:kind==='low'?20:0,age:2})];if($('speed').value==='fast')Object.assign(game.obstacles[0],{x:420,reacting:true,vx:-5000,vy:0,angularVelocity:8});if(scenario==='high'){game.y=125;game.jumps=0}if(scenario==='top'){game.y=65;game.vy=-450;game.obstacles[0].x=220}if(scenario==='under'){game.y=60;game.vy=500;game.jumps=0;game.obstacles[0].x=218}if(scenario==='fatal')game.health=1;paint()}
function advance(dt){if(game.state==='discovery')game.discoveryAge+=dt;else{game.update(dt);if(game.state==='discovery'){game.discoveryStartX=game.x;game.discoveryStartY=game.y}}}
$('throw').addEventListener('click',()=>{reset();game.obstacles=[];game.serial=$('scenario').value==='high'?1:3;game.bookSerial=['book-red','book-green','book-blue'].indexOf($('bookform').value);game.x=70;game.spawn();paint()});
$('finish').addEventListener('click',()=>{reset();game.obstacles=[];game.elapsed=CONFIG.duration-.01;advance(.02);game.discoveryAge=.8;renderer.debug=false;paint()});
$('scenario').addEventListener('change',reset);$('bookform').addEventListener('change',reset);$('speed').addEventListener('change',reset);$('gallery').addEventListener('click',()=>{reset();game.x=80;game.obstacles=PROPS_LAYOUT.frames.map((f,i)=>createProp(f.id,{id:i,kind:f.id,x:180+i*100,lift:0,age:2}));renderer.debug=false;paint()});$('debug').addEventListener('click',()=>{renderer.debug=!renderer.debug;paint()});$('scroll').addEventListener('click',()=>{game.distance+=1000;paint()});$('reset').addEventListener('click',reset);$('impact').addEventListener('click',()=>{automatic=false;for(let i=0;i<120&&game.hits===0;i++)game.update(1/120);paint()});$('step').addEventListener('click',()=>{automatic=false;advance(.1);paint()});$('auto').addEventListener('click',()=>{automatic=!automatic;last=null;$('auto').textContent=automatic?'잠시 정지':'자동 재생'});$('jump').addEventListener('click',()=>{game.jump();paint()});window.addEventListener('resize',()=>{renderer.resize();paint()});document.addEventListener('visibilitychange',()=>{if(document.hidden)automatic=false;last=null});
function frame(time){if(automatic&&!document.hidden){advance(last===null?0:Math.min(.1,(time-last)/1000));paint()}last=time;requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
