<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충돌 동작 검증 · 사서를 잡아라!</title><link rel="stylesheet" href="../styles.css"><style>main{padding:20px 0}h1{font-size:24px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button,select{min-height:44px;padding:8px 12px}canvas{border:4px solid #61442f;border-radius:8px}output{display:block;margin:15px 0;padding:12px;background:#fff9ec;font-family:monospace;white-space:pre-wrap;font-size:14px}p{font-size:13px}</style></head><body><main><h1>충돌 동작 검증</h1><p>실제 게임의 물리·렌더러를 사용하는 개발 확인 화면입니다. 충돌 상자는 이 화면에서만 표시합니다.</p><div class="tools"><label for="scenario">상황</label><select id="scenario"><option value="stack">바닥 책 더미</option><option value="basket">바구니</option><option value="low">낮은 책</option><option value="high">높은 책 · 공중</option><option value="top">위에서 착지</option><option value="under">아래쪽 접촉</option><option value="fatal">마지막 체력</option></select><button id="reset">다시 준비</button><button id="impact">충돌 순간</button><button id="step">0.1초 진행</button><button id="auto">자동 재생</button><button id="jump">점프</button></div><canvas id="preview" width="960" height="500" aria-label="실제 러너 충돌 동작"></canvas><output id="status">그림을 준비하고 있습니다.</output></main><script type="module">
import {Chase} from '../engine.js?v=20261023-v2';import {Renderer} from '../renderer.js?v=20261023-v2';
const $=id=>document.getElementById(id),game=new Chase();let automatic=false,last=null;
const layout=await fetch('../assets/sprites/sprite-layout-v2.json').then(r=>r.json());
const images=await Promise.all(layout.sheets.map(s=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src='../'+s.image})));
const renderer=new Renderer($('preview'),images,layout);renderer.debug=true;
function paint(){renderer.draw(game,game.elapsed);$('status').textContent=JSON.stringify({health:game.health,state:game.state,hitFrame:game.hitFrame,x:+game.x.toFixed(3),y:+game.y.toFixed(3),vx:+game.vx.toFixed(2),propVx:+(game.obstacles[0]?.vx||0).toFixed(2),hitStop:+game.hitStop.toFixed(3),penetration:+game.maxPenetration.toFixed(6)},null,2)}
function reset(){automatic=false;last=null;$('auto').textContent='자동 재생';game.start();game.spawnAt=1000;const scenario=$('scenario').value,kind=scenario==='fatal'||scenario==='top'?'stack':scenario==='under'?'high':scenario;game.obstacles=[{id:1,kind,x:270,w:kind==='basket'?62:48,h:['high','low'].includes(kind)?25:kind==='basket'?45:53,lift:kind==='high'?128:kind==='low'?20:0,age:2}];if(scenario==='high'){game.y=125;game.jumps=0}if(scenario==='top'){game.y=65;game.vy=-450;game.obstacles[0].x=220}if(scenario==='under'){game.y=60;game.vy=500;game.jumps=0;game.obstacles[0].x=218}if(scenario==='fatal')game.health=1;paint()}
$('scenario').addEventListener('change',reset);$('reset').addEventListener('click',reset);$('impact').addEventListener('click',()=>{automatic=false;for(let i=0;i<120&&game.hits===0;i++)game.update(1/120);paint()});$('step').addEventListener('click',()=>{automatic=false;game.update(.1);paint()});$('auto').addEventListener('click',()=>{automatic=!automatic;last=null;$('auto').textContent=automatic?'잠시 정지':'자동 재생'});$('jump').addEventListener('click',()=>{game.jump();paint()});window.addEventListener('resize',()=>{renderer.resize();paint()});document.addEventListener('visibilitychange',()=>{if(document.hidden)automatic=false;last=null});
function frame(time){if(automatic&&!document.hidden){game.update(last===null?0:Math.min(.1,(time-last)/1000));paint()}last=time;requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
